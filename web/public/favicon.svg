<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Base Background -->
  <rect width="64" height="64" rx="14" fill="url(#fav-grad)"/>
  
  <!-- Sleek Layered Geometric Elements -->
  <rect x="12" y="12" width="40" height="40" rx="8" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Analytics Chart & Dollar Symbol Intersection -->
  <path d="M20 42 L20 34" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M28 42 L28 26" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M36 42 L36 20" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M44 42 L44 28" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Accent Pulse Dot -->
  <circle cx="36" cy="18" r="3" fill="#10b981" filter="url(#shadow)"/>
</svg>